# https://github.com/crate-ci/typos — identifiers not in default dictionary.
[default]
# Preserve Windows whoami's documented "/fo" output-format flag.
extend-ignore-re = ['"/fo"']

[default.extend-identifiers]
scanfs = "scanfs"
xxhash = "xxhash"
phash = "phash"
docx = "docx"
ffprobe = "ffprobe"
exif = "exif"
walkdir = "walkdir"
kamadak = "kamadak"
lopdf = "lopdf"
roxmltree = "roxmltree"

# Preserve exact upstream license/notice bytes; hashes are checked separately.
[files]
extend-exclude = ["licenses/upstream/**", "tools/project-catalog/native-a11y/vendor/**"]
