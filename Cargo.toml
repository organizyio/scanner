[workspace]
members = ["crates/*", "scanfs", "scanner"]
exclude = ["compat/scan-engine"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
