[package]
name = "scanner-phash"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Perceptual hashing utilities used by scanner-core."
repository = "https://github.com/organizyio/scanner"

[lib]
name = "phash"

[dependencies]
img_hash = "3"
# Activate only PNG on the exact image graph used by img_hash.
image = { version = "=0.23.14", default-features = false, features = ["png"] }
thiserror = "2"
