[package]
name = "scanner-phash"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Perceptual hashing utilities used by scanner-core."
repository = "https://github.com/organizyio/scanner"

[lib]
name = "phash"

[dependencies]
img_hash = "3"
# Retain img_hash pixel/resizing types; decode PNG through the budgeted reader.
image = { version = "=0.23.14", default-features = false }
png = "=0.18.1"
thiserror = "2"
