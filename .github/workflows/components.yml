name: Consolidated components
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: components-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    name: Compatibility (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned Rust
        run: rustup toolchain install 1.88 --profile minimal --component rustfmt --component clippy --no-self-update
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: compat/scan-fs/go.sum
      - name: Engine format, lint and tests
        working-directory: compat/scan-engine
        run: |
          cargo +1.88 fmt --all -- --check
          cargo +1.88 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.88 test --workspace --locked
      - name: Component archive regressions
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Build local engine and embedded wrapper
        run: |
          python scripts/build-components.py engine --archive
          python scripts/build-components.py wrapper --archive
      - name: Wrapper unit and required real-engine integration
        working-directory: compat/scan-fs
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly ./... -count=1
          go test -mod=readonly -tags=integration ./tests/integration/... -count=1
      - name: Project discovery characterization
        working-directory: tools/project-catalog
        env:
          CGO_ENABLED: '0'
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly ./... -count=1
      - name: Package independent catalog and legacy launchers
        run: |
          python scripts/build-components.py catalog --archive
          python scripts/build-components.py launchers --archive
      - name: Verify public history and component source contracts
        run: python scripts/verify-consolidation.py
      - uses: actions/upload-artifact@v6
        with:
          name: components-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  catalog-build-matrix:
    name: Catalog CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: tools/project-catalog/go.sum
      - name: Preserve project CLI cross-build matrix
        working-directory: tools/project-catalog
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -mod=readonly ./cmd/scan-cli
  gui-build:
    name: Fyne build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.13'
          cache-dependency-path: tools/project-catalog/go.sum
      - name: Linux Fyne prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxcb1-dev xorg-dev xvfb xauth
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned native accessibility compiler
        run: rustup toolchain install 1.88 --profile minimal --component clippy --component rustfmt --no-self-update
      - name: Validate and build native accessibility adapter
        run: python scripts/build-native-a11y.py --check
      - name: Windows qualification supervisor regressions
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -File scripts/test-windows-qualification-stages.ps1
      - name: Windows native owner-thread and query-close lifecycle regression
        if: runner.os == 'Windows'
        working-directory: tools/project-catalog
        shell: pwsh
        run: |
          gcc -std=c11 -O2 native-a11y/tests/windows_lifecycle.c -luser32 -o "$env:RUNNER_TEMP/scanner-a11y-lifecycle.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/scanner-a11y-lifecycle.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: macOS native owner-close and reentrant update regression
        if: runner.os == 'macOS'
        working-directory: tools/project-catalog
        run: |
          clang -std=c11 -fblocks native-a11y/tests/macos_lifecycle.m -framework AppKit -framework Foundation -o "$RUNNER_TEMP/scanner-a11y-lifecycle"
          "$RUNNER_TEMP/scanner-a11y-lifecycle"
      - name: Compile macOS native qualification helpers (interaction remains separate)
        if: runner.os == 'macOS'
        run: |
          swiftc scripts/platform-macos.swift -o "$RUNNER_TEMP/scanner-ax-helper"
          swiftc scripts/platform-macos-observer.swift -o "$RUNNER_TEMP/scanner-ax-observer"
      - name: Linux checked stale-window and concurrent close regression
        if: runner.os == 'Linux'
        working-directory: tools/project-catalog
        run: |
          gcc -std=c11 -O2 native-a11y/tests/linux_lifecycle.c -lxcb -lpthread -o "$RUNNER_TEMP/scanner-a11y-lifecycle"
          xvfb-run -a "$RUNNER_TEMP/scanner-a11y-lifecycle"
      - name: Linux real D-Bus cache-signal regression
        if: runner.os == 'Linux'
        run: python scripts/test-native-cache-signals.py
      - name: Fyne shutdown queue regression and race tests
        working-directory: tools/project-catalog/third_party/fyne
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -race ./internal/async
      - name: macOS ready-event selection regression
        if: runner.os == 'macOS'
        working-directory: tools/project-catalog/third_party/fyne
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -tags ci ./internal/driver/glfw -run '^TestNextMainEventReady$' -count=1
      - name: Native GUI semantic and lifecycle regression tests
        working-directory: tools/project-catalog
        env:
          CGO_ENABLED: '1'
        run: go test -a -mod=readonly -tags ci ./internal/gui ./internal/nativea11y
      - name: Compile native Fyne application (operation remains separately qualified)
        working-directory: tools/project-catalog
        env:
          CGO_ENABLED: '1'
        run: go build -a -mod=readonly ./cmd/scan-gui
      - name: Validate GUI archive and upstream notices (no publication)
        run: python scripts/build-components.py catalog --gui --archive
